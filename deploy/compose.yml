name: hrgos-rule-tests
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hrg_tests
      POSTGRES_USER: hrg
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请配置数据库密码}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U hrg -d hrg_tests"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      DATABASE_URL: postgresql://hrg:${POSTGRES_PASSWORD}@db:5432/hrg_tests
      TEST_API_KEY: ${TEST_API_KEY:?请配置测试访问密钥}
      TEST_API_ENABLED: "true"
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:?请配置允许的前端来源}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:4000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  gateway:
    image: caddy:2-alpine
    environment:
      API_DOMAIN: ${API_DOMAIN:?请配置后端域名}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres-data:
  caddy-data:
  caddy-config:
