<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>五队 Bingo 二次元主题 v2 总览</title>
  <style>
    @font-face { font-family: FangYuan; src: url('../../public/fonts/AlimamaFangYuanTiVF.woff2') format('woff2'); }
    * { box-sizing: border-box; }
    body { width: 1600px; margin: 0; padding: 36px 65px 50px; background: #070907; color: #f5f7f2; font-family: FangYuan, sans-serif; }
    header { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 28px; }
    header small { color: #c8ff32; font-size: 13px; font-weight: 900; letter-spacing: .22em; }
    h1 { margin: 4px 0 0; font-size: 44px; line-height: 1.1; }
    header p { max-width: 500px; margin: 0; color: #9ba59d; font-size: 15px; line-height: 1.6; }
    main { display: grid; grid-template-columns: repeat(6,1fr); gap: 18px; }
    a { grid-column: span 2; display: block; overflow: hidden; border: 1px solid #313a33; border-radius: 9px; color: inherit; text-decoration: none; background: #0d100e; }
    a:nth-child(4) { grid-column: 2 / span 2; }
    a:nth-child(5) { grid-column: 4 / span 2; }
    img { display: block; width: 100%; aspect-ratio: 1; }
    .label { display: flex; justify-content: space-between; align-items: center; padding: 10px 13px 13px; font-size: 15px; }
    .label b { color: var(--accent); }
    .label span { color: #9ba59d; font-size: 12px; }
  </style>
</head>
<body>
  <header><div><small>HRG // TEAM BINGO · V2</small><h1>五队配色 × 二次元外框</h1></div><p>同一张静态 5 × 5 棋盘。浅蓝、紫、深蓝、黄、彩色马卡龙分别配以漫画速度线、网点和星形高光。</p></header>
  <main>
    <a href="01-phigros.png" style="--accent:#a9dfff"><img src="01-phigros.png" alt="Phigros队"><div class="label"><b>01 · Phigros队</b><span>浅蓝色</span></div></a>
    <a href="02-arcaea.png" style="--accent:#c2a0ff"><img src="02-arcaea.png" alt="Arcaea队"><div class="label"><b>02 · Arcaea队</b><span>紫色</span></div></a>
    <a href="03-paradigm.png" style="--accent:#84adff"><img src="03-paradigm.png" alt="范式起源队"><div class="label"><b>03 · 范式起源队</b><span>深蓝色</span></div></a>
    <a href="04-maimai.png" style="--accent:#ffe36d"><img src="04-maimai.png" alt="maimai队"><div class="label"><b>04 · maimai队</b><span>黄色</span></div></a>
    <a href="05-community.png" style="--accent:#f4c9e6"><img src="05-community.png" alt="全能队"><div class="label"><b>05 · 全能队</b><span>彩色马卡龙</span></div></a>
  </main>
</body>
</html>
