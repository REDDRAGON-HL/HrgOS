</style><div class="sheet"><h1>失序<span>重奏</span></h1><p class="line">宫商角徵羽，各循一段路。</p><p class="line">初声已落地，余响叩两门。</p><p class="line">画里风未动，目光先启程。</p><p class="line">墨痕尚无言，脚步替它答。</p><p class="line">星点各自亮，相逢便成弦。</p></div></html>
